<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — Sentinel Analytics AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#1847F5;--blue-h:#0F38D9;--blue-lt:#EEF2FF;--blue-bdr:rgba(24,71,245,.18);--navy:#060D1E;--ink:#0A0F1E;--ink2:#1E293B;--ink3:#334155;--mute:#64748B;--mute2:#94A3B8;--surf:#F8FAFC;--surf2:#F1F5F9;--bdr:#E2E8F0;--bdr2:#CBD5E1;--green:#10B981;--red:#EF4444;--sans:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;--r8:8px;--r12:12px;--r16:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--surf);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
/* Nav */
.auth-nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;background:#fff;border-bottom:1px solid var(--bdr)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px}
.logo-text{font-size:15px;font-weight:800;color:var(--ink)}
.logo-text span{color:var(--blue)}
/* Layout */
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r16);padding:48px 40px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(10,15,30,.06)}
.auth-icon{width:52px;height:52px;background:var(--blue-lt);border-radius:var(--r12);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:24px}
.auth-title{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--mute);line-height:1.7;margin-bottom:28px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.form-input{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--ink);font-family:var(--sans);font-size:14px;padding:12px 16px;border-radius:var(--r8);outline:none;transition:border-color .2s;margin-bottom:16px}
.form-input:focus{border-color:var(--blue);background:#fff}
.form-input::placeholder{color:var(--mute2)}
.btn-primary{width:100%;background:var(--blue);color:#fff;border:none;font-family:var(--sans);font-size:15px;font-weight:600;padding:13px;border-radius:var(--r8);cursor:pointer;transition:background .18s}
.btn-primary:hover{background:var(--blue-h)}
.btn-primary:disabled{background:var(--mute2);cursor:not-allowed}
.back-link{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--mute);text-decoration:none;margin-top:20px;justify-content:center;transition:color .18s}
.back-link:hover{color:var(--ink)}
/* States */
.msg{display:none;padding:14px 16px;border-radius:var(--r8);font-size:14px;font-weight:500;margin-bottom:16px}
.msg.success{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;display:block}
.msg.error{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;display:block}
@media(max-width:480px){.auth-nav{padding:0 20px}.auth-card{padding:32px 24px}}
</style>
</head>
<body>
<nav class="auth-nav">
  <a href="index.html" class="logo">
    <div class="logo-mark"><svg viewBox="0 0 18 18" fill="none"><path d="M9 2L14.5 5.5V12.5L9 16L3.5 12.5V5.5L9 2Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" fill="#fff"/></svg></div>
    <span class="logo-text">Sentinel<span>Analytics</span>.AI</span>
  </a>
  <a href="login.html" style="font-size:13px;font-weight:600;color:var(--mute);text-decoration:none">Back to sign in</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon">🔑</div>
    <div class="auth-title">Forgot your password?</div>
    <div class="auth-sub">Enter the email address linked to your account and we'll send you a password reset link.</div>

    <div class="msg" id="msg"></div>

    <div id="form-area">
      <label class="form-label" for="email">Work email</label>
      <input type="email" id="email" class="form-input" placeholder="jane@company.com" required autocomplete="email">
      <button class="btn-primary" id="submit-btn" onclick="sendReset()">Send reset link</button>
    </div>

    <a href="login.html" class="back-link">&#8592; Back to sign in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://esztisxqhdhkyaoaxfxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Nfl2HFR0yf1fFaHjDf_JFw_WbCvUj3X';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function sendReset() {
  var email = document.getElementById('email').value.trim();
  var btn   = document.getElementById('submit-btn');

  if (!email) { showMsg('Please enter your email address.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  var redirectTo = window.location.origin +
    window.location.pathname.replace('forgot-password.html', 'reset-password.html');

  var { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

  if (error) {
    showMsg('Something went wrong. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  } else {
    // Always show success even if email not found (security best practice)
    document.getElementById('form-area').innerHTML =
      '<div style="text-align:center;padding:12px 0">' +
      '<div style="font-size:40px;margin-bottom:16px">📧</div>' +
      '<div style="font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px">Check your inbox</div>' +
      '<div style="font-size:14px;color:var(--mute);line-height:1.7">We sent a password reset link to <strong>' + email + '</strong>. Check your spam folder if you don\'t see it within a minute.</div>' +
      '</div>';
  }
}

document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendReset();
});
</script>
</body></html>
