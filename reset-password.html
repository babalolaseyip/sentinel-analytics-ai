<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Set New Password — Sentinel Analytics AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#1847F5;--blue-h:#0F38D9;--blue-lt:#EEF2FF;--blue-bdr:rgba(24,71,245,.18);--navy:#060D1E;--ink:#0A0F1E;--ink2:#1E293B;--mute:#64748B;--mute2:#94A3B8;--surf:#F8FAFC;--bdr:#E2E8F0;--green:#10B981;--red:#EF4444;--sans:'Plus Jakarta Sans',sans-serif;--r8:8px;--r12:12px;--r16:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--surf);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
.auth-nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;background:#fff;border-bottom:1px solid var(--bdr)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px}
.logo-text{font-size:15px;font-weight:800;color:var(--ink)}
.logo-text span{color:var(--blue)}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r16);padding:48px 40px;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(10,15,30,.06)}
.auth-icon{width:52px;height:52px;background:var(--blue-lt);border-radius:var(--r12);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:24px}
.auth-title{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--mute);line-height:1.7;margin-bottom:28px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.form-input{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--ink);font-family:var(--sans);font-size:14px;padding:12px 16px;border-radius:var(--r8);outline:none;transition:border-color .2s;margin-bottom:8px}
.form-input:focus{border-color:var(--blue);background:#fff}
.pw-wrap{position:relative;margin-bottom:16px}
.pw-wrap .form-input{margin-bottom:0;padding-right:48px}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--mute);padding:4px}
.pw-hint{font-size:12px;color:var(--mute2);margin-bottom:16px;margin-top:4px}
.strength-bar{height:4px;border-radius:2px;background:var(--bdr);margin-bottom:16px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
.btn-primary{width:100%;background:var(--blue);color:#fff;border:none;font-family:var(--sans);font-size:15px;font-weight:600;padding:13px;border-radius:var(--r8);cursor:pointer;transition:background .18s}
.btn-primary:hover{background:var(--blue-h)}
.btn-primary:disabled{background:var(--mute2);cursor:not-allowed}
.msg{display:none;padding:14px 16px;border-radius:var(--r8);font-size:14px;font-weight:500;margin-bottom:16px}
.msg.success{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;display:block}
.msg.error{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;display:block}
@media(max-width:480px){.auth-nav{padding:0 20px}.auth-card{padding:32px 24px}}
</style>
</head>
<body>
<nav class="auth-nav">
  <a href="index.html" class="logo">
    <div class="logo-mark"><svg viewBox="0 0 18 18" fill="none"><path d="M9 2L14.5 5.5V12.5L9 16L3.5 12.5V5.5L9 2Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.5" fill="#fff"/></svg></div>
    <span class="logo-text">Sentinel<span>Analytics</span>.AI</span>
  </a>
</nav>

<div class="auth-wrap">
  <div class="auth-card" id="main-card">
    <div class="auth-icon">🔒</div>
    <div class="auth-title">Set new password</div>
    <div class="auth-sub">Choose a strong password for your Sentinel Analytics AI account.</div>

    <div class="msg" id="msg"></div>

    <div id="form-area">
      <label class="form-label" for="password">New password</label>
      <div class="pw-wrap">
        <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" oninput="checkStrength(this.value)">
        <button class="pw-toggle" type="button" onclick="togglePw('password',this)">👁️</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>

      <label class="form-label" for="confirm">Confirm new password</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" class="form-input" placeholder="Repeat your password">
        <button class="pw-toggle" type="button" onclick="togglePw('confirm',this)">👁️</button>
      </div>

      <button class="btn-primary" id="submit-btn" onclick="updatePassword()" style="margin-top:8px">Update password</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://esztisxqhdhkyaoaxfxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Nfl2HFR0yf1fFaHjDf_JFw_WbCvUj3X';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase sends the token in the URL hash — handle it on load
window.addEventListener('load', async function() {
  var hash = window.location.hash;
  if (!hash.includes('access_token') && !hash.includes('type=recovery')) {
    showMsg('Invalid or expired reset link. Please request a new one.', 'error');
    document.getElementById('submit-btn').disabled = true;
    setTimeout(function(){ window.location.href='forgot-password.html'; }, 3000);
  }
});

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function togglePw(id, btn) {
  var input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁️' : '🙈';
}

function checkStrength(pw) {
  var fill = document.getElementById('strength-fill');
  var score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  var pct  = (score / 5) * 100;
  var colours = ['#EF4444','#F59E0B','#F59E0B','#10B981','#10B981'];
  fill.style.width  = pct + '%';
  fill.style.background = colours[Math.max(0, score-1)] || '#EF4444';
}

async function updatePassword() {
  var pw   = document.getElementById('password').value;
  var conf = document.getElementById('confirm').value;
  var btn  = document.getElementById('submit-btn');

  if (pw.length < 8)   { showMsg('Password must be at least 8 characters.', 'error'); return; }
  if (pw !== conf)     { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  var { error } = await sb.auth.updateUser({ password: pw });

  if (error) {
    showMsg('Could not update password. Your reset link may have expired — please request a new one.', 'error');
    btn.disabled = false;
    btn.textContent = 'Update password';
  } else {
    document.getElementById('form-area').innerHTML =
      '<div style="text-align:center;padding:12px 0">' +
      '<div style="font-size:40px;margin-bottom:16px">✅</div>' +
      '<div style="font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px">Password updated</div>' +
      '<div style="font-size:14px;color:var(--mute);margin-bottom:24px">Your password has been changed successfully.</div>' +
      '<a href="login.html" style="display:inline-block;background:var(--blue);color:#fff;padding:12px 28px;border-radius:8px;font-weight:600;text-decoration:none">Sign in now &#8594;</a>' +
      '</div>';
  }
}
</script>
</body></html>
